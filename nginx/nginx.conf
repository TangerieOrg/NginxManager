worker_processes auto;

events {
    worker_connections 1024;
}

http {
    tcp_nodelay on;
    server_tokens off;

    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Upstreams are resolved per request so a missing service doesn't break a reload
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Requests come through the host nginx, keep what it set
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    map $http_x_real_ip $forwarded_real_ip {
        default $http_x_real_ip;
        "" $remote_addr;
    }

    map $http_x_forwarded_for $forwarded_for {
        default $http_x_forwarded_for;
        "" $remote_addr;
    }

    map $http_x_forwarded_host $forwarded_host {
        default $http_x_forwarded_host;
        "" $http_host;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" "";
    }

    absolute_redirect off;
    client_max_body_size 0;

    log_format upstreamlog '[$time_local] $forwarded_real_ip - $host to: $upstream_addr: $request $status upstream_response_time $upstream_response_time msec $msec request_time $request_time';
    access_log /var/log/nginx/access.log upstreamlog;
    error_log /var/log/nginx/error.log;

    server {
        listen 8081;

        location = /healthz {
            access_log off;
            return 200;
        }
    }

    include /etc/nginx/locations/*.conf;
}

# ^~ means dont regex check
